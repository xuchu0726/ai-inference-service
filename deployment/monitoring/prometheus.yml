global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "fastapi-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: "vllm-server"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8002"]
