events {}

http {
    log_format gateway_access
        '$remote_addr $request_method $request_uri '
        'status=$status upstream=$upstream_addr '
        'upstream_status=$upstream_status '
        'request_time=$request_time '
        'upstream_time=$upstream_response_time';

    access_log /var/log/nginx/access.log gateway_access;

    upstream gateway_service {
        server inference-gateway.ai-inference.svc.cluster.local:8000;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name _;

        location = /nginx-healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /livez {
            proxy_pass http://gateway_service;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /readyz {
            proxy_pass http://gateway_service;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /health {
            proxy_pass http://gateway_service;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /generate {
            proxy_pass http://gateway_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_next_upstream off;
        }
    }
}
