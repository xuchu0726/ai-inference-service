apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-gateway
  namespace: ai-inference
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: inference-gateway
  template:
    metadata:
      labels:
        app: inference-gateway
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: inference-gateway
                topologyKey: kubernetes.io/hostname
      containers:
        - name: gateway
          image: ai-inference-gateway:week3-resilience-v9
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: gateway-config
            - configMapRef:
                name: week3-primary-runtime
            - configMapRef:
                name: week3-fallback-runtime
            - configMapRef:
                name: week3-resilience-runtime
            - secretRef:
                name: week3-primary-auth
            - secretRef:
                name: week3-fallback-auth
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
